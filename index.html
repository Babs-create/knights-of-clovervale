<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Knights of Clovervale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Layout: one framed game window (canvas + HUD overlays), a slim controls strip under it. Single dark look by choice. */
:root{
  --felt:#11221d; --felt-2:#1a3029; --panel:#203a32; --line:#33554a;
  --ink:#f2ead8; --muted:#a8bba9; --gold:#e9b649; --gold-ink:#2a1d05;
  --ember:#e2633d; --plate:#ece3cf; --plate-edge:#cbbd9c; --violet:#8a5cd0;
  --display:"Grenze Gotisch","Palatino Linotype",Georgia,serif;
  --ui:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--felt) radial-gradient(1200px 600px at 50% -10%,#1d3a31 0%,transparent 70%);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px 28px}
#page{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:.6em 1.05em;background:var(--panel);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 #0b1714;display:inline-flex;align-items:center;gap:.45em;line-height:1.2}
.btn:hover{background:#28473d}
.btn:active{transform:translateY(2px)}
.btn.gold{background:var(--gold);color:var(--gold-ink);box-shadow:inset 0 0 0 1.5px #b88a26,0 3px 0 #7a5a12;font-weight:600}
.btn.gold:hover{background:#f2c565}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- game window ---------- */
#game{position:relative;border-radius:18px;overflow:hidden;background:#0b1712;box-shadow:inset 0 0 0 1.5px #ffffff18,0 18px 40px -20px #000c;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{display:block;width:100%;height:100%}
.hud{position:absolute;pointer-events:none;z-index:2}
#hud-tl{top:10px;left:10px;display:flex;flex-direction:column;gap:6px}
.hearts{display:flex;gap:3px}
.hearts svg{width:22px;height:22px;filter:drop-shadow(0 1px 1px #0009)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#0b1612cc;border-radius:999px;padding:.15em .65em;font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:5px;box-shadow:inset 0 0 0 1px #ffffff22;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px}
#obj{top:10px;left:50%;transform:translateX(-50%);max-width:min(460px,52%);background:#2a2410e6;border-radius:12px;padding:6px 12px;box-shadow:inset 0 0 0 1.5px var(--gold);font-size:.88rem;line-height:1.3;text-align:center}
#obj b{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
#mini{top:10px;right:10px;border-radius:10px;box-shadow:0 0 0 2px #0b1612,0 0 0 3.5px #ffffff30;image-rendering:pixelated;background:#0b1612}
#abil{bottom:10px;left:10px;display:flex;gap:8px;align-items:center}
.ab{position:relative;width:46px;height:46px;border-radius:12px;background:#0b1612d9;box-shadow:inset 0 0 0 1.5px #ffffff30;display:grid;place-items:center;overflow:hidden;font-size:.65rem;font-weight:600;text-align:center;line-height:1}
.ab i{position:absolute;inset:auto 0 0 0;background:#e9b64955;height:0}
.ab span{position:relative}
.ab.ready{box-shadow:inset 0 0 0 2px var(--gold)}
#bossbar{top:72px;left:50%;transform:translateX(-50%);width:min(440px,74%);text-align:center;background:#0b1612e0;border-radius:12px;padding:5px 10px 8px;box-shadow:inset 0 0 0 1.5px #e2633d99}
#bossbar b{font-family:var(--display);font-size:1.15rem;display:block;line-height:1.1;margin-bottom:4px}
#bossbar .bb{height:10px;border-radius:5px;background:#00000090;overflow:hidden}
#bossbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e2633d,#f2a04a);transition:width .2s}
#bossbar.shield{box-shadow:inset 0 0 0 1.5px #c9a3ff}
#bossbar.shield i{background:linear-gradient(90deg,#7a44b0,#c9a3ff)}
body.boss #toast{top:128px}
.diffs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.diffs .btn[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--gold),0 3px 0 #0b1714;background:#2c4a3e}
.diffnote{font-size:.85rem;color:var(--muted);max-width:52ch}
#toast{top:64px;left:50%;transform:translateX(-50%);background:#0b1612e6;border-radius:12px;padding:8px 14px;box-shadow:inset 0 0 0 1.5px #8fd18a88;font-weight:500;max-width:min(520px,90%);text-align:center;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}

/* dialogue */
#dlg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(720px,calc(100% - 20px));z-index:4;display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
#dlg .por{width:96px;flex:none;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,#f7f0de,var(--plate) 60%,#ddd0b2);box-shadow:inset 0 0 0 3px var(--plate-edge),0 8px 20px -8px #000;display:grid;place-items:center}
#dlg .por img{width:80%;height:80%;object-fit:contain}
#dlg .box{flex:1;min-width:0;background:var(--plate);color:#2b2418;border-radius:16px;padding:12px 16px 10px;box-shadow:0 10px 30px -10px #000}
#dlg .who{font-family:var(--display);font-size:1.35rem;line-height:1;margin-bottom:4px;color:#5a2b14}
#dlg .txt{font-size:1rem;min-height:3em}
#dlg .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#dlg .opts .btn{background:#2b2418;color:var(--plate);box-shadow:none;font-size:.9rem}
#dlg .opts .btn:disabled{opacity:.4}
#dlg .more{font-size:.75rem;color:#7a6a4d;text-align:right;margin-top:2px}
@media (max-width:560px){#dlg .por{width:64px}#dlg .txt{font-size:.92rem}}

/* overlays */
.ov{position:absolute;inset:0;z-index:6;background:radial-gradient(circle at 50% 30%,#1e3a5acc,#0c1512f2 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;text-align:center;overflow:auto}
.ov h1{font-size:clamp(2.2rem,7vw,4.2rem);line-height:.95}
.ov h1 span{color:var(--gold)}
.ov h2{font-size:clamp(1.8rem,5vw,2.8rem)}
.ov p{max-width:58ch;color:#d9d3c2}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:760px}
.pick{border:0;background:#0f201bcc;color:var(--ink);border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:inset 0 0 0 1.5px #ffffff18}
.pick[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--gold);background:#1c3a30}
.pick .duo{display:flex;align-items:flex-end;justify-content:center;height:84px}
.pick .duo img{height:76px;width:auto}
.pick .duo img.h{height:60px;margin-left:-14px}
.pick b{font-family:var(--display);font-size:1.25rem}
.pick span{font-size:.78rem;color:var(--muted);line-height:1.25}
.pick em{font-style:normal;color:var(--gold);font-weight:600;font-size:.82rem}
@media (max-width:640px){.picks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.journal{max-width:620px;width:100%;text-align:left;display:flex;flex-direction:column;gap:10px}
.q{background:#0b1612cc;border-radius:12px;padding:10px 14px;box-shadow:inset 0 0 0 1px #ffffff1c}
.q h3{font-size:1.3rem}
.q.done{opacity:.6}
.q.active{box-shadow:inset 0 0 0 2px var(--gold)}
.q small{color:var(--muted);display:block}
.tag{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--gold)}

/* touch controls */
#touch{position:absolute;inset:0;z-index:3;pointer-events:none}
#stick{position:absolute;left:14px;bottom:14px;width:120px;height:120px;border-radius:50%;background:#0b161288;box-shadow:inset 0 0 0 2px #ffffff30;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#e9b649cc;box-shadow:0 2px 6px #0008}
#tbtns{position:absolute;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:8px;pointer-events:auto}
.tb{border:0;border-radius:50%;background:#0b1612cc;color:var(--ink);font-size:.72rem;font-weight:600;box-shadow:inset 0 0 0 2px #ffffff40;touch-action:none}
.tb.big{background:#e9b649dd;color:var(--gold-ink);box-shadow:inset 0 0 0 2px #b88a26}
.tb.on{background:#5b9be0cc}
body.touch #abil{bottom:150px}

/* below the game */
.strip{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--felt-2);border-radius:14px;padding:10px 14px;box-shadow:inset 0 0 0 1.5px var(--line)}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted)}
.keys kbd{font-family:var(--ui);background:#0b1612;border-radius:6px;padding:.05em .45em;color:var(--ink);box-shadow:inset 0 -2px 0 #ffffff1a,inset 0 0 0 1px #ffffff26;font-size:.8rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="page">
  <div id="game">
    <canvas id="cv" aria-label="Game world"></canvas>
    <div id="hud-tl" class="hud"></div>
    <div id="obj" class="hud"></div>
    <canvas id="mini" class="hud" width="128" height="104" aria-hidden="true"></canvas>
    <div id="abil" class="hud"></div>
    <div id="toast" class="hud" role="status"></div>
    <div id="bossbar" class="hud" hidden><b></b><div class="bb"><i></i></div></div>
    <div id="touch" hidden>
      <div id="stick"><div id="knob"></div></div>
      <div id="tbtns">
        <button class="tb" data-k="ride">Ride</button>
        <button class="tb" data-k="ability">Power</button>
        <button class="tb" data-k="talk">Talk</button>
        <button class="tb" data-k="block">Block</button>
        <button class="tb big" data-k="attack" style="grid-column:span 2;border-radius:30px">Sword</button>
      </div>
    </div>
    <div id="dlg" hidden></div>
    <div id="ov" class="ov"></div>
  </div>
  <div class="strip">
    <div class="keys">
      <span><kbd>WASD</kbd>/<kbd>Arrows</kbd> move</span>
      <span><kbd>Space</kbd> sword</span>
      <span><kbd>Shift</kbd> hold to block</span>
      <span><kbd>E</kbd> knight power</span>
      <span><kbd>R</kbd> ride / dismount</span>
      <span><kbd>F</kbd> talk / use</span>
      <span><kbd>Q</kbd> journal</span>
      <span><kbd>T</kbd> whistle for the dragon (Chapter 2)</span>
    </div>
    <div class="row"><button class="btn" id="jbtn">Journal</button></div>
  </div>
</div>

function carve(pts, rad, type){
  for(let i=0;i<pts.length-1;i++){
    const [ax,ay] = pts[i], [bx,by] = pts[i+1];
    const n = Math.ceil(Math.hypot(bx-ax,by-ay)*3);
    for(let s=0;s<=n;s++){
      const px = ax+(bx-ax)*s/n, py = ay+(by-ay)*s/n;
      for(let y=Math.floor(py-rad-1); y<=py+rad+1; y++) for(let x=Math.floor(px-rad-1); x<=px+rad+1; x++){
        if(Math.hypot(x+.5-px, y+.5-py) <= rad && x>0 && y>0 && x<MW-1 && y<MH-1){
          const t = at(x,y); if(t===WATER||t===BRIDGE||t===WALL||t===BLOCK||t===STONE) continue;
          setT(x,y,type); keep[y*MW+x] = 1;
        }
      }
    }
  }
}
function disc(cx,cy,r,fn){ for(let y=Math.floor(cy-r-1); y<=cy+r+1; y++) for(let x=Math.floor(cx-r-1); x<=cx+r+1; x++){ const d = Math.hypot(x+.5-cx, y+.5-cy); if(d<=r && x>=0&&y>=0&&x<MW&&y<MH) fn(x,y,d); } }

function buildMap(){
  const R = mulberry(20261026);
  map.fill(G); keep.fill(0); crackHits = {};
  // river
  for(let x=0;x<MW;x++){
    const c = 20 + Math.round(Math.sin(x*.22)*1.4);
    for(let y=c-1;y<=c+1;y++) setT(x,y,WATER);
    if(at(x,c-2)===G) setT(x,c-2,SAND);
    if(at(x,c+2)===G) setT(x,c+2,SAND);
  }
  for(let x=31;x<=33;x++) for(let y=0;y<MH;y++) if(at(x,y)===WATER) setT(x,y,BRIDGE);
  // courtyard
  for(let y=39;y<=51;y++) for(let x=18;x<=45;x++){ setT(x,y,STONE); keep[y*MW+x]=1; }
  for(let x=18;x<=45;x++){ if(x<30||x>33) setT(x,39,WALL); setT(x,51,WALL); }
  for(let y=39;y<=51;y++){ setT(18,y,WALL); setT(45,y,WALL); }
  for(let y=44;y<=49;y++) for(let x=28;x<=36;x++) setT(x,y,BLOCK);   // castle footprint (row 50 is the front walk)
  for(let y=40;y<=41;y++) for(let x=40;x<=43;x++) setT(x,y,BLOCK);   // forge
  for(let y=46;y<=48;y++) for(let x=20;x<=22;x++) setT(x,y,BLOCK);   // wizard tent
  for(let x=39;x<=41;x++) setT(x,47,BLOCK);                          // scribe desk
  for(let y=43;y<=44;y++) for(let x=38;x<=39;x++) setT(x,y,BLOCK);   // fountain
  // paddock
  const pd = PLACES.paddock;
  for(let y=pd.y0;y<=pd.y1;y++) for(let x=pd.x0;x<=pd.x1;x++){
    const edge = x===pd.x0||x===pd.x1||y===pd.y0||y===pd.y1;
    setT(x,y, edge ? FENCE : G);
  }
  setT(pd.x1,42,G); setT(pd.x1,43,G);
  // roads
  carve([[32.5,39.5],[32.5,34],[31,30],[32.5,26],[32.5,22],[32.5,17],[33.5,13],[37.5,11],[41.5,10.5]], 1.25, PATH);
  carve([[33.5,13.5],[26.5,11.5],[18.5,9.5],[13.5,8.5]], 1.0, PATH);
  carve([[26.5,11.5],[25.5,8],[24.5,5.4]], 1.0, PATH);
  carve([[9,37.3],[4,37.3],[1.2,37.3]], 1.0, PATH);
  carve([[13.2,6.6],[12.4,3.6],[11.5,1.3]], 1.0, PATH);
  carve([[31.5,30.5],[38.5,30],[46.5,29],[54.5,27.8]], 1.0, PATH);
  // hidden pony trail (grass, no road)
  carve([[21,32],[16.5,29.8],[13.2,30.2],[10.2,27.6],[7.2,25.6]], .85, G);
  // clearings
  disc(6,25.2,2.7,(x,y)=>{ if(at(x,y)!==WATER){ setT(x,y,G); keep[y*MW+x]=1; } });
  disc(46.5,9.5,5.3,(x,y)=>{ setT(x,y,G); keep[y*MW+x]=1; });
  disc(9.5,7.5,4.2,(x,y)=>{ setT(x,y,G); keep[y*MW+x]=1; });
  const clearSpot = (cx,cy,r)=>disc(cx,cy,r,(x,y)=>{ const t=at(x,y); if(t===TREE||t===ROCK) setT(x,y,G); if(t!==WATER&&t!==WALL&&t!==BRIDGE) keep[y*MW+x]=1; });
  BANNERS.forEach(([x,y])=>clearSpot(x,y,1.7));
  LOGS.forEach(([x,y])=>clearSpot(x,y,1.0));
  clearSpot(4.5,36.6,1.8);
  RACE.forEach(([x,y])=>clearSpot(x,y,1.35));
  clearSpot(RACE_POST[0],RACE_POST[1],1.3);
  { const pts=[RACE_POST,...RACE]; for(let i=0;i<pts.length-1;i++){ const [ax,ay]=pts[i],[bx,by]=pts[i+1], n=Math.ceil(Math.hypot(bx-ax,by-ay)*3);
      for(let k=0;k<=n;k++) clearSpot(ax+(bx-ax)*k/n, ay+(by-ay)*k/n, .95); } }
  CACHES.forEach(([cx,cy])=>disc(cx,cy,1.4,(x,y)=>{ if(at(x,y)===G||at(x,y)===TREE){ setT(x,y,G); keep[y*MW+x]=1; } }));
  for(let y=2;y<=11;y++) for(let x=55;x<=61;x++){ setT(x,y,G); keep[y*MW+x]=1; }
  // north-east chest ring clearing
  disc(56.5,27.5,2.6,(x,y)=>{ keep[y*MW+x]=1; });
  ORC_SPAWNS.forEach(([id,k,x,y])=>disc(x,y,1.6,(tx,ty)=>{ if(at(tx,ty)===G) keep[ty*MW+tx]=1; }));
  // trees
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const i = y*MW+x; if(map[i]!==G || keep[i]) continue;
    let p = .035;
    if(x<=1||x>=MW-2||y<=1||y>=MH-1) p = 1;
    else if(y>=39) p = 1;
    else if(y<=18) p = .56;
    else if(x<=20 && y>=23 && y<=32) p = .74;
    else if(y<=24) p = .18;
    else if(x>=55 && y<=31) p = .3;
    if(R() < p) setT(x,y,TREE);
  }
  // vines: tower wall, pedestal ring, dragon ring
  for(let y=1;y<=12;y++) setT(54,y,VINE);
  for(let x=54;x<=62;x++) setT(x,12,VINE);
  for(let y=7;y<=9;y++) for(let x=45;x<=47;x++) setT(x,y,(x===46&&y===8)?BLOCK:VINE);
  disc(9.5,7.5,2.45,(x,y,d)=>{ setT(x,y, d>1.45 ? VINE : BLOCK); });
  // crystals, tablet
  CRYSTALS.forEach(([s,x,y])=>setT(x,y,BLOCK));
  setT(PLACES.tablet[0],PLACES.tablet[1],BLOCK);
  // chest ring with one cracked rock
  const [cx,cy] = PLACES.chest;
  for(let y=cy-1;y<=cy+1;y++) for(let x=cx-1;x<=cx+1;x++) if(!(x===cx&&y===cy)) setT(x,y,ROCK);
  setT(cx-1,cy,CRACK); setT(cx,cy,G);
  // tall grass and mud patches
  const tallC = [[12,36,2.3],[24,36.5,1.8],[40,34.5,2.2],[48,31.5,1.6],[56,36,2.4],[37,25,1.6],[25,27,1.6],[5,36,2],[60,24,1.5],[43,17,1.5],[52,15,1.3],[15,33,1.2]];
  tallC.forEach(([x0,y0,r])=>disc(x0,y0,r,(x,y)=>{ if(at(x,y)===G && !keep[y*MW+x]) setT(x,y,TALL); }));
  [[34.5,15.5,1.5],[22,10.5,1.3],[27,25,1.1]].forEach(([x0,y0,r])=>disc(x0,y0,r,(x,y)=>{ const t=at(x,y); if(t===G||t===PATH||t===TREE) setT(x,y,MUD); }));
  disc(50.5,34.5,2.4,(x,y,d)=>{ setT(x,y, d<1.15 ? WATER : MUD); });
  // fences (jump them on horseback)
  for(let x=6;x<=27;x++) if(at(x,34)!==PATH) setT(x,34,FENCE);
  for(let y=31;y<=37;y++) if(at(44,y)!==PATH) setT(44,y,FENCE);
  for(let x=36;x<=41;x++) if(at(x,26)===G||at(x,26)===TALL) setT(x,26,FENCE);
  // a few boulders
  [[14,37.2],[52,24],[38,35],[20,15],[29,6],[41,16],[59,20],[3,26]].forEach(([x,y])=>{ if(!keep[y*MW+x]) setT(x,y,ROCK); });
  // Coppercap Mine entrance in a rocky hill
  for(let y=2;y<=3;y++) for(let x=22;x<=27;x++) setT(x,y,ROCK);
  [22,23,25,26,27].forEach(x=>setT(x,4,ROCK)); setT(24,4,PATH);
  [[9,1],[9,2],[14,1],[14,2],[13,1]].forEach(([x,y])=>setT(x,y,ROCK));
  for(let y=5;y<=8;y++) for(let x=57;x<=60;x++) setT(x,y,BLOCK);   // Dark Tower footprint
  for(let k=21;k<=28;k++) setT(k,1,ROCK);
  // library footprint
  for(let y=44;y<=46;y++) for(let x=42;x<=44;x++) setT(x,y,BLOCK);
}

function blob(c,x,y,r,col){ c.fillStyle=col; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); }
function paintStatic(x0,y0,x1,y1){ return INDOOR(AREA) ? paintIndoor(x0,y0,x1,y1) : AREA==="mine" ? paintMine(x0,y0,x1,y1) : AREA==="world" ? paintWorld(x0,y0,x1,y1) : paintWild(x0,y0,x1,y1); }
function paintWorld(x0,y0,x1,y1){
  const c = sctx;
  x0=clamp(x0,0,MW-1); y0=clamp(y0,0,MH-1); x1=clamp(x1,0,MW-1); y1=clamp(y1,0,MH-1);
  c.save(); c.beginPath(); c.rect(x0*TILE,y0*TILE,(x1-x0+1)*TILE,(y1-y0+1)*TILE); c.clip();
  const ax=Math.max(0,x0-2), ay=Math.max(0,y0-2), bx=Math.min(MW-1,x1+2), by=Math.min(MH-1,y1+2);
  const each = (fn) => { for(let y=ay;y<=by;y++) for(let x=ax;x<=bx;x++) fn(x,y,at(x,y),x*TILE+TILE/2,y*TILE+TILE/2); };
  // grass
  each((x,y,t,px,py)=>{ const h=hash(x,y); c.fillStyle = h<.33?"#86bf63":h<.66?"#8cc56a":"#92ca6f"; c.fillRect(x*TILE,y*TILE,TILE,TILE);
    if(h>.7){ c.strokeStyle="#76ad55"; c.lineWidth=2; c.beginPath(); const ox=px-8+h*12, oy=py+4; c.moveTo(ox,oy); c.lineTo(ox-2,oy-7); c.moveTo(ox+4,oy); c.lineTo(ox+5,oy-6); c.stroke(); } });
  each((x,y,t,px,py)=>{ if(t===SAND) blob(c,px,py,TILE*.74,"#e2cf9a"); });
  each((x,y,t,px,py)=>{ if(t===PATH||((t===SAND||t===BRIDGE)&&x>=31&&x<=33)) blob(c,px,py,TILE*.78,"#d8b67c"); });
  each((x,y,t,px,py)=>{ if(t===PATH){ blob(c,px,py,TILE*.55,"#dfc08a"); if(hash(x,y)>.6) blob(c,px-6+hash(y,x)*12,py+5,2.2,"#b99a66"); } });
  each((x,y,t,px,py)=>{ if(t===MUD){ blob(c,px,py,TILE*.74,"#8b6b44"); if(hash(x,y)>.5) blob(c,px+5,py-4,5,"#9c7b51"); } });
  each((x,y,t,px,py)=>{ if(t===WATER||t===BRIDGE) blob(c,px,py,TILE*.8,"#4f9bd0"); });
  each((x,y,t,px,py)=>{ if(t===WATER||t===BRIDGE) blob(c,px,py,TILE*.5,"#62afe0"); });
  // courtyard stone
  each((x,y,t)=>{ if(y>=39 && x>=18 && x<=45 && (t===STONE||t===BLOCK)){ c.fillStyle = hash(x,y)>.5?"#cfc7b5":"#c8c0ad"; c.fillRect(x*TILE,y*TILE,TILE,TILE); c.strokeStyle="#b5ac98"; c.lineWidth=1.5; c.strokeRect(x*TILE+1,y*TILE+1,TILE-2,TILE-2); } });
  // tall grass
  each((x,y,t,px,py)=>{ if(t!==TALL) return; for(let k=0;k<5;k++){ const ox=px-14+k*7+hash(x+k,y)*3, oy=py+12; c.strokeStyle=k%2?"#4f8e3f":"#5fa34b"; c.lineWidth=3; c.lineCap="round"; c.beginPath(); c.moveTo(ox,oy); c.quadraticCurveTo(ox+3,oy-14,ox-2+hash(y,x+k)*6,oy-24); c.stroke(); } });
  // flowers
  each((x,y,t,px,py)=>{ if(t!==G) return; const h=hash(x*3,y*7); if(h<.93) return; const col=["#f7a8c4","#fff1a8","#ffffff","#c9a8f7"][Math.floor(h*400)%4]; for(let k=0;k<3;k++){ const fx=px-10+hash(x,k)*20, fy=py-10+hash(k,y)*20; blob(c,fx,fy,3.2,col); blob(c,fx,fy,1.3,"#e9b649"); } });
  // bridge
  each((x,y,t,px,py)=>{ if(t!==BRIDGE) return; c.fillStyle="#a8774a"; c.fillRect(x*TILE,y*TILE-2,TILE,TILE+4); c.strokeStyle="#7f5531"; c.lineWidth=2; for(let k=0;k<4;k++){ c.beginPath(); c.moveTo(x*TILE,y*TILE+k*10+3); c.lineTo(x*TILE+TILE,y*TILE+k*10+3); c.stroke(); }
    c.fillStyle="#6e4728"; if(x===31) c.fillRect(x*TILE,y*TILE-4,6,TILE+8); if(x===33) c.fillRect(x*TILE+TILE-6,y*TILE-4,6,TILE+8); });
  // fences
  each((x,y,t,px,py)=>{ if(t!==FENCE) return; const hz = at(x-1,y)===FENCE||at(x+1,y)===FENCE; c.fillStyle="#9c6c40"; c.strokeStyle="#6e4728"; c.lineWidth=1.5;
    if(hz){ c.fillRect(x*TILE,py-9,TILE,5); c.fillRect(x*TILE,py+1,TILE,5); c.fillRect(px-4,py-15,8,24); c.strokeRect(px-4,py-15,8,24); }
    else { c.fillRect(px-9,y*TILE,5,TILE); c.fillRect(px+3,y*TILE,5,TILE); c.fillRect(px-6,py-6,12,14); c.strokeRect(px-6,py-6,12,14); } });
  // rocks
  each((x,y,t,px,py)=>{ if(t!==ROCK&&t!==CRACK) return; blob(c,px+2,py+8,TILE*.42,"#00000026"); blob(c,px,py,TILE*.46,"#8e959c"); blob(c,px-5,py-6,TILE*.24,"#aab1b7");
    if(t===CRACK){ const hits = crackHits[x+","+y]||0; c.strokeStyle="#3d4247"; c.lineWidth=2.4; c.beginPath(); c.moveTo(px-10,py-10); c.lineTo(px-2,py-2); c.lineTo(px-6,py+6); c.lineTo(px+4,py+12); c.moveTo(px-2,py-2); c.lineTo(px+10,py-4); if(hits>0){ c.moveTo(px+10,py-4); c.lineTo(px+14,py+6); c.moveTo(px-6,py+6); c.lineTo(px-14,py+4); } c.stroke(); } });
  // walls
  each((x,y,t,px,py)=>{ if(t!==WALL) return; c.fillStyle="#9aa1a8"; c.fillRect(x*TILE,y*TILE,TILE,TILE); c.fillStyle="#b4bbc1"; c.fillRect(x*TILE,y*TILE,TILE,TILE*.35); c.strokeStyle="#7d848b"; c.lineWidth=1.5; c.strokeRect(x*TILE+1,y*TILE+1,TILE-2,TILE-2); c.beginPath(); c.moveTo(x*TILE,py+4); c.lineTo(x*TILE+TILE,py+4); c.moveTo(px,py+4); c.lineTo(px,y*TILE+TILE); c.stroke(); });
  // castle and buildings
  drawCastle(c); drawTent(c); drawForge(c); drawDesk(c); drawFountain(c); drawHay(c); drawRestoration(c); drawMineDoor(c); drawWildSigns(c);
  // trees
  each((x,y,t,px,py)=>{ if(t!==TREE) return; const h=hash(x,y), r=TILE*(.56+h*.16); blob(c,px+4,py+10,r*.8,"#00000030");
    c.fillStyle="#6b4a2c"; c.fillRect(px-3,py,6,12);
    blob(c,px,py-6,r, h<.33?"#3d8649":h<.66?"#46924f":"#367a43"); blob(c,px-r*.3,py-6-r*.3,r*.45,h<.5?"#57a85c":"#5fae5f"); });
  // tower (behind vines)
  const ti = IM.tower; if(ti && ti.naturalWidth){ const hh=270, ww=hh*ti.naturalWidth/ti.naturalHeight; c.drawImage(ti, PLACES.tower[0]*TILE-ww/2, PLACES.tower[1]*TILE-hh+20, ww, hh); }
  // vines
  each((x,y,t,px,py)=>{ if(t!==VINE) return; blob(c,px,py,TILE*.55,"#4a2470"); blob(c,px+6,py-4,TILE*.34,"#6a36a0"); c.strokeStyle="#9d63da"; c.lineWidth=3; c.lineCap="round"; c.beginPath(); c.arc(px-4,py+2,8,0,4.2); c.stroke(); c.beginPath(); c.arc(px+8,py-6,5,1,5.5); c.stroke(); blob(c,px-12,py-8,2.5,"#d8b8ff"); blob(c,px+12,py+10,2.5,"#d8b8ff"); });
  c.restore();
}
function img(c,k,cx,bottom,h){ const i=IM[k]; if(!i||!i.naturalWidth) return; const w=h*i.naturalWidth/i.naturalHeight; c.drawImage(i,cx-w/2,bottom-h,w,h); }
function drawCastle(c){ blob(c,32.5*TILE,50.4*TILE,TILE*4.4,"#00000020"); img(c,"castle",32.5*TILE,51.25*TILE,300); }
function drawTent(c){ const x=21.5*TILE, y=49*TILE; c.fillStyle="#00000030"; c.beginPath(); c.ellipse(x,y,64,14,0,0,7); c.fill();
  c.fillStyle="#2f7f8a"; c.beginPath(); c.moveTo(x-62,y); c.lineTo(x,y-118); c.lineTo(x+62,y); c.closePath(); c.fill();
  c.fillStyle="#256870"; c.beginPath(); c.moveTo(x,y-118); c.lineTo(x+62,y); c.lineTo(x+18,y); c.closePath(); c.fill();
  c.fillStyle="#173f45"; c.beginPath(); c.moveTo(x-16,y); c.lineTo(x,y-50); c.lineTo(x+16,y); c.closePath(); c.fill();
  c.fillStyle="#e9b649"; c.beginPath(); c.arc(x-20,y-62,9,.6,5.6); c.arc(x-16,y-64,7,5.6,.6,true); c.fill(); blob(c,x,y-120,5,"#e9b649"); }

/* ---------- statue pushing (vault) ---------- */
function updatePush(dt){
  props.forEach(s=>{ if(s.type==="statue" && s.mv){ s.mv.t+=dt; const k=Math.min(1,s.mv.t/.2); s.x=(s.mv.fx+(s.tx-s.mv.fx)*k+.5)*TILE; s.y=(s.mv.fy+(s.ty-s.mv.fy)*k+1)*TILE-4; if(k>=1) s.mv=null; } });
  if(S.c3.vault || !P.moving) { pushT=0; return; }
  const dir = Math.abs(P.fx)>Math.abs(P.fy) ? [Math.sign(P.fx),0] : [0,Math.sign(P.fy)];
  const fx=Math.floor((P.x+dir[0]*(P.r+8))/TILE), fy=Math.floor((P.y+dir[1]*(P.r+6))/TILE);
  const st=props.find(p=>p.type==="statue" && p.tx===fx && p.ty===fy && !p.mv);
  if(!st){ pushT=0; return; }
  if(!pushDir || pushDir[0]!==dir[0] || pushDir[1]!==dir[1]){ pushDir=dir; pushT=0; }
  pushT+=dt; if(pushT<.22) return; pushT=0;
  const nx=st.tx+dir[0], ny=st.ty+dir[1], t=at(nx,ny);
  if(SOLID.has(t) || occ.has(nx+","+ny) || t===UP){ floatText(st.x,st.y-70,"Won't budge","#cfd4d8"); return; }
  st.mv={fx:st.tx, fy:st.ty, t:0}; st.tx=nx; st.ty=ny; rebuildOcc(); burst(st.x,st.y-6,"#b6bcc1",6,70);
  const onPlates = VAULT_PLATES.filter(([x,y])=>occ.has(x+","+y)).length;
  if(at(nx,ny)===PLATE) floatText((nx+.5)*TILE,(ny)*TILE-30,`${onPlates} of 3 plates`,"#f4d27a",true);
  if(onPlates===3){ S.c3.vault=true; setT(9,8,IFLOOR); setT(10,8,IFLOOR); repaintTile(9,8); repaintTile(10,8); shake=.4; save(); toast("Click, clunk... the iron gate rises! The vault is open.",4200); }
}
function resetStatues(){
  if(S.c3.vault) return say("Lever","The gate is already open. No need to reset.");
  props.filter(p=>p.type==="statue").forEach(s=>{ const [x,y]=VAULT_STATUES[s.i]; s.tx=x; s.ty=y; s.x=(x+.5)*TILE; s.y=(y+1)*TILE-4; s.mv=null; });

}

function dragonSpot(b){

function losClear(x0,y0,x1,y1){ const d=Math.hypot(x1-x0,y1-y0), n=Math.ceil(d/12); for(let i=2;i<n;i++){ const t=tileAtPx(x0+(x1-x0)*i/n, y0+(y1-y0)*i/n); if(t===ROCK||t===CLIFF||t===FURN||t===IWALL) return false; } return true; }
function dragonAttack(b){
  const d=Math.hypot(P.x-b.x,P.y-b.y), r=Math.random();
  if(d>240){ if(r<.55) startBreath(b); else { b.state="barrage"; b.k=b.phase===2?5:3; b.t=.2; } }
  else { if(r<.45){ b.state="rise"; b.t=.5; } else if(r<.75){ b.state="gust"; b.t=1.3; b.k=.3; } else startBreath(b); }
}

function updateDragon(dt){
  const b=boss; if(!b || b.kind!=="dragon") return;
  b.flash=Math.max(0,b.flash-dt); b.t-=dt;
  props.forEach(k=>{ if(k.type==="knot") k.flash=Math.max(0,k.flash-dt); });

      say({name:"Ember the Dragon", img:"dragon"},["The dragon's eyes glow purple. The bell's spell has it. It roars and spreads its wings!","Purple vine knots feed it a magic shield. Cut the three knots first, then strike the dragon. Hide behind rocks from its fire breath."]); } return; }
  if(!inArena){ b.z=Math.max(0,b.z-200*dt); return; }
  const dx=P.x-b.x, dy=P.y-b.y, d=Math.hypot(dx,dy)||1; if(Math.abs(dx)>8) b.face = dx>0?1:-1;

  const toward=(tx,ty,s)=>{ const ex=tx-b.x, ey=ty-b.y, ed=Math.hypot(ex,ey); if(ed<4) return true; const m=Math.min(ed,s*dt); b.x+=ex/ed*m; b.y+=ey/ed*m; return ed<8; };

    case "breathWind": if(b.t > b.tw*.35) b.ang=Math.atan2(P.y-b.y,P.x-b.x); if(b.t<=0){ b.state="breath"; b.t=.75; } break;
    case "breath": {
      for(let i=0;i<4;i++){ const a=b.ang+rnd(-.4,.4), r=rnd(30,330); parts.push({x:b.x+Math.cos(a)*r, y:b.y+Math.sin(a)*r-10, vx:Math.cos(a)*60, vy:Math.sin(a)*60-30, life:rnd(.25,.5), max:.5, color:Math.random()<.5?"#ff8a3a":"#ffd27a", size:rnd(4,8)}); }
      const pa=Math.atan2(dy,dx); let da=Math.abs(pa-b.ang); if(da>Math.PI) da=Math.PI*2-da;
      if(d<335 && da<.42 && losClear(b.x,b.y,P.x,P.y)) hurtPlayer({x:b.x,y:b.y},dmgOf(1),true);
      if(b.t<=0) dragonNext(b); break; }
    case "barrage": if(b.t<=0){ fires.push({x:P.x+rnd(-14,14)+P.fx*30, y:P.y+rnd(-10,10)+P.fy*20, t:.95, r:46}); b.k--; b.t=.38*(b.phase===2?.8:1); if(b.k<=0){ b.state="wait"; b.t=.9; } } break;
    case "wait": if(b.t<=0) dragonNext(b); break;
    case "rise": b.z=Math.min(130,b.z+300*dt); if(b.t<=0){ b.state="hover"; b.t=.8*D().wind; } break;
    case "hover": b.z=130; toward(P.x,P.y,330*D().spd); if(b.t<=0){ b.state="drop"; b.t=.34; b.lx=P.x; b.ly=P.y; } break;
    case "drop": { toward(b.lx,b.ly,600); b.z=Math.max(0,b.z-420*dt);
      if(b.t<=0){ b.z=0; shake=.5; rings.push({x:b.x,y:b.y,r:20,max:120,life:.35,col:"#ffcf9a"}); burst(b.x,b.y,"#a39782",30,200,5);
        const dd=Math.hypot(P.x-b.x,P.y-b.y); if(dd<64) hurtPlayer({x:b.x,y:b.y},dmgOf(2),true); else if(dd<120) hurtPlayer({x:b.x,y:b.y},1,true);
        b.state="dizzy"; b.t=1.9; floatText(b.x,b.y-170,"Dizzy! Strike now!","#f2d24a",true); } break; }
    case "dizzy": if(b.t<=0) dragonNext(b); break;

      b.k-=dt; if(b.k<=0){ b.k=.42; const a=Math.atan2(dy,dx)+rnd(-.25,.25); arrows.push({x:b.x,y:b.y-10,vx:Math.cos(a)*300,vy:Math.sin(a)*300,life:1.6,own:"orc",spark:true}); }
      for(let i=0;i<2;i++) parts.push({x:b.x+rnd(-60,60), y:b.y-rnd(20,90), vx:dx/d*260, vy:dy/d*260, life:.4, max:.4, color:"rgba(235,245,255,.8)", size:3});
      if(b.t<=0) dragonNext(b); break; }
  }

}
function makeGrim(){ const hp=Math.round(64*D().boss); boss={kind:"grim", name:"Grimtusk the Bell-Ringer", x:13*TILE, y:7*TILE, z:0, r:22, hp, max:hp, state:"wait", t:0, phase:1, face:1, flash:0, active:false, summons:0, combo:0}; shocks=[]; }

const stick = {x:0, y:0, id:null};
function setupTouch(){
  const touch = matchMedia("(pointer:coarse)").matches || "ontouchstart" in window;
  if(!touch) return;
  document.body.classList.add("touch"); $("#touch").hidden = false;
  const st = $("#stick"), kn = $("#knob");
  const upd = e=>{ const r = st.getBoundingClientRect(); let dx = e.clientX-(r.left+r.width/2), dy = e.clientY-(r.top+r.height/2); const d = Math.hypot(dx,dy), m = r.width/2-10; if(d>m){ dx*=m/d; dy*=m/d; } stick.x = dx/m; stick.y = dy/m; kn.style.transform = `translate(${dx}px,${dy}px)`; };
  st.addEventListener("pointerdown", e=>{ stick.id = e.pointerId; st.setPointerCapture(e.pointerId); upd(e); });
  st.addEventListener("pointermove", e=>{ if(e.pointerId===stick.id) upd(e); });
  const end = e=>{ if(e.pointerId!==stick.id) return; stick.id=null; stick.x=stick.y=0; kn.style.transform=""; };
  st.addEventListener("pointerup", end); st.addEventListener("pointercancel", end);
  document.querySelectorAll(".tb").forEach(b=>{
    const k = b.dataset.k;
    b.addEventListener("pointerdown", e=>{ e.preventDefault(); if(!keys[k]) hit[k]=true; keys[k]=true; b.classList.add("on"); });
    const up = ()=>{ keys[k]=false; b.classList.remove("on"); };
    b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up); b.addEventListener("pointerleave", up);
  });
}

function blocked(x,y,r,isP){ return solidAt(x-r,y-r*.6,isP)||solidAt(x+r,y-r*.6,isP)||solidAt(x-r,y+r*.6,isP)||solidAt(x+r,y+r*.6,isP)||solidAt(x,y-r*.7,isP)||solidAt(x,y+r*.7,isP); }
function slideTo(e,axis,d,ip){ const cur=axis==="y"?e.y:e.x, base=(Math.floor(cur/TILE)+.5)*TILE; let best=null;
  for(const c of [base, base-TILE, base+TILE]){ if(Math.abs(c-cur)>TILE*.72) continue; const ok = axis==="y" ? !blocked(e.x+d, c, e.r, ip) : !blocked(c, e.y+d, e.r, ip); if(ok && (best===null || Math.abs(c-cur)<Math.abs(best-cur))) best=c; }
  if(best===null) return; const step=Math.min(Math.abs(d)*.9, Math.abs(best-cur))*Math.sign(best-cur);
  if(axis==="y"){ if(!blocked(e.x,e.y+step,e.r,ip)) e.y+=step; } else { if(!blocked(e.x+step,e.y,e.r,ip)) e.x+=step; } }
function moveEnt(e,dx,dy){ let bump=false; const ip=e===P; if(dx){ if(!blocked(e.x+dx,e.y,e.r,ip)) e.x+=dx; else { bump=true; if(ip && !dy) slideTo(e,"y",dx,ip); } } if(dy){ if(!blocked(e.x,e.y+dy,e.r,ip)) e.y+=dy; else { bump=true; if(ip && !dx) slideTo(e,"x",dy,ip); } } e.x=clamp(e.x,TILE,WW-TILE); e.y=clamp(e.y,TILE,WH-TILE); return bump; }
function floatText(x,y,text,color="#fff",big=false){ floats.push({x,y,text,color,life:1,big}); }
function burst(x,y,color,n=10,spd=120,size=3){ for(let i=0;i<n;i++){ const a=Math.random()*7, s=rnd(spd*.4,spd); parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:rnd(.4,.8),max:.8,color,size:rnd(size*.6,size)}); } }
function toast(msg, ms=3800){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); toastT = ms/1000; }
function coinsDrop(x,y,n){ for(let i=0;i<n;i++) pickups.push({type:"coin", x, y, vx:rnd(-90,90), vy:rnd(-90,90), z:0, vz:rnd(140,220), age:0}); }

const K = () => KNIGHTS[S.knight];

function doHit(cx,cy,rad,dmg,kind){
  let any = false;
  orcs.forEach(o=>{ if(o.state==="dizzy"||o.state==="flee"||S.stage>=21) return; if(Math.hypot(o.x-cx,o.y-cy) < rad+o.r){ hurtOrc(o,dmg,kind); any=true; } });
  if(boss && Math.hypot(boss.x-cx, boss.y-30-cy) < rad+(boss.kind==="dragon"?54:30)){ if(hurtBoss(dmg,kind)) any=true; }
  props.forEach(p=>{ if(p.type==="crystal" && Math.hypot(p.x-cx,p.y-cy) < rad+18){ strikeCrystal(p); any=true; }
    if(p.type==="cart" && Math.hypot(p.x-cx,p.y-cy) < rad+22){ pushCart(p); any=true; }
    if(p.type==="lever" && Math.hypot(p.x-cx,p.y-cy) < rad+18){ toggleLever(p); any=true; }
    if(p.type==="glow" && Math.hypot(p.x-cx,p.y-cy) < rad+20){ lightGlow(p); any=true; }
    if(p.type==="moon" && Math.hypot(p.x-cx,p.y-cy) < rad+20){ useMoon(p); any=true; }
    if(p.type==="knot" && p.hp>0 && Math.hypot(p.x-cx,p.y-18-cy) < rad+24){ p.hp-=dmg; p.flash=.15; burst(p.x,p.y-20,"#c9a3ff",10,120); floatText(p.x,p.y-60,p.hp>0?String(dmg):"Cut!","#d8b8ff",p.hp<=0);
      if(p.hp<=0){ p.hp=0; burst(p.x,p.y-20,"#7a44b0",26,170,4); shake=.2; if(!props.some(q=>q.type==="knot"&&q.hp>0)) toast("The vine shield is broken! Strike the dragon!",3000); } any=true; }
    if(p.type==="dummy" && Math.hypot(p.x-cx,p.y-30-cy) < rad+22){ p.hits = p.hitT>0 ? p.hits+1 : 1; p.hitT=1.2; floatText(p.x,p.y-82,String(dmg),"#fff"); burst(p.x,p.y-40,"#e8d0a0",6,90); any=true; }
    if(p.type==="bell" && Math.hypot(p.x-cx,p.y-cy) < rad+56){ strikeBell(p); any=true; }
    if(p.type==="rune" && P.sense>0 && !S.c3.t4b && Math.hypot(p.x-cx,p.y-cy) < rad+22){ openRune(); any=true; } });
  // tall grass and cracked rock
  const tx0=Math.floor((cx-rad)/TILE), tx1=Math.floor((cx+rad)/TILE), ty0=Math.floor((cy-rad)/TILE), ty1=Math.floor((cy+rad)/TILE);
  for(let ty=ty0;ty<=ty1;ty++) for(let tx=tx0;tx<=tx1;tx++){
    const t = at(tx,ty), px=(tx+.5)*TILE, py=(ty+.5)*TILE;
    if(Math.hypot(px-cx,py-cy) > rad+TILE*.5) continue;
    if(t===TALL){ setT(tx,ty,G); repaintTile(tx,ty); burst(px,py,"#5fa34b",8,90); const r=Math.random(); if(r<.12*D().heart/.35) pickups.push({type:"heart",x:px,y:py,vx:0,vy:0,z:0,vz:160,age:0}); else if(r<.3) coinsDrop(px,py,1); }
    if(t===PILE){ const key=tx+","+ty; crackHits[key]=(crackHits[key]||0)+(kind==="power"?2:1); burst(px,py,"#b6bcc1",8,100);
      if(crackHits[key]>=2){ setT(tx,ty,FLOOR); S.mine.piles.push(key); S.mat.stone+=2; floatText(px,py-30,"+2 stone","#d6dbe0",true); save(); } repaintTile(tx,ty); any=true; continue; }
    if(t===ORE){ const key=tx+","+ty; crackHits[key]=(crackHits[key]||0)+(kind==="power"?3:1); burst(px,py,"#e08a4a",8,100);
      if(crackHits[key]>=3){ setT(tx,ty,CAVE); S.mine.ores.push(key); S.mat.ore+=2; floatText(px,py-30,"+2 copper ore","#f0b070",true); save(); } repaintTile(tx,ty); any=true; continue; }
    if(t===CRACK && kind!=="power"){ burst(px,py,"#8e959c",5,70); floatText(px,py-30,"Clang!","#cfd4d8"); if(!S.clangTold){ S.clangTold=true; toast(S.team.includes("red")?"Too tough for a sword. Switch to the Red Knight at a banner and use Power Strike (E).":"Too tough for a sword. Only the Red Knight's Power Strike could break it."); } any=true; continue; }
    if(t===CRACK){ const key=tx+","+ty; crackHits[key]=3; burst(px,py,"#8e959c",8,100);
      if(crackHits[key]>=3){ setT(tx,ty,AREA==="mine"?FLOOR:INDOOR(AREA)?IFLOOR:G); if(AREA==="mine") S.mine.crack=true; else if(AREA==="ridge") S.ridge.crack=true; else if(AREA==="tower2") S.c3.t2crack=true; else S.cracked=true; save(); burst(px,py,"#aab1b7",20,160,4); shake=.25; toast("The cracked rock crumbles!"); } repaintTile(tx,ty); any=true; }
  }
  return any;
}
function hurtOrc(o,dmg,kind){

function hurtPlayer(src,dmg,unblockable){

  const dx=src.x-P.x, dy=src.y-P.y, d=Math.hypot(dx,dy)||1;

function strikeCrystal(c){
  if(S.solved || c.lit || c.cool>0) return;
  c.cool = .45;
  const next = S.order[S.progress];
  if(c.sym===next){ c.lit=true; S.progress++; burst(c.x,c.y-30,SYMS[c.sym].c,16,130,4); floatText(c.x,c.y-70,SYMS[c.sym].n+"!",SYMS[c.sym].c,true);
    if(S.progress>=4) solvePuzzle(); }
  else { props.forEach(p=>{ if(p.type==="crystal") p.lit=false; }); S.progress=0; burst(c.x,c.y-30,"#888",10,90); floatText(c.x,c.y-70,"Wrong order","#ffb59a",true);
    toast(S.tabletRead ? "The crystals go dark. Start again with the first symbol on the tablet." : "The crystals go dark. The stone tablet nearby shows the order."); }
  save();
}
function solvePuzzle(){
  S.solved = true;
  for(let y=7;y<=9;y++) for(let x=45;x<=47;x++) if(at(x,y)===VINE){ setT(x,y,G); burst((x+.5)*TILE,(y+.5)*TILE,"#b88cf0",14,140,4); }
  paintStatic(43,5,49,11); paintMini(); shake=.35;
  if(S.stage<8) S.stage=8;
  toast("All four crystals sing. The vines wither away from the pedestal!", 4500);
  save();
}

    return {t:"Reach the top of the ridge and face the enchanted dragon.", at:{x:20.5*TILE,y:6*TILE,h:40}};
  }

  return sideObjective() || {t:S.stage>=21 ? "You saved Clovervale! Explore, race, train, or start a new quest on Hard." : "Press T to fly with Ember.", at:null};
}

function updateRace(dt){
  if(!race) return;
  if(race.count>0){ race.count-=dt; if(race.count<=0) floatText(P.x,P.y-110,"Go!","#8fd18a",true); return; }
  race.t+=dt;
  if(!P.mounted){ race=null; toast("You got off your horse. The run is over. Try again at the course post."); return; }
  if(race.t>120){ race=null; toast("Out of time. Try again at the course post."); return; }
  const c=RACE[race.i], cx=c[0]*TILE, cy=c[1]*TILE;
  if(Math.hypot(P.x-cx,P.y-cy)<54){
    burst(cx,cy-40,"#e9b649",14,140); race.i++;
    if(race.i>=RACE.length) return finishRace();
    floatText(cx,cy-80,`${race.i}/${RACE.length}`,"#e9b649");
  }
}
function finishRace(){
  const t=race.t; race=null;
  const medal = t<GOLD_T?3 : t<SILVER_T?2 : 1;
  const firstBest = !S.race.best || t<S.race.best; if(firstBest) S.race.best=t;
  let reward=0; for(let m=S.race.medal+1;m<=medal;m++) reward+=MEDALS[m].coins;
  if(medal>S.race.medal) S.race.medal=medal;
  S.coins+=reward; save(); burst(P.x,P.y-40,MEDALS[medal].c,40,200,4);
  const next = medal===1?`Beat ${SILVER_T}s for Silver.`:medal===2?`Beat ${GOLD_T}s for Gold.`:"That's the fastest ribbon there is!";
  say({name:"Riding Course"}, `Finished in ${t.toFixed(1)} seconds${firstBest?", a new best":""}! ${MEDALS[medal].n} ribbon${reward?` and ${reward} coins`:""}. ${next}`);
}

function updateArrows(dt){

function drawObjective(){

  if(inView){ const by=ty+Math.sin(tNow*4)*5; ctx.fillStyle="#e9b649"; ctx.strokeStyle="#2a1d05"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(tx-10,by-14); ctx.lineTo(tx+10,by-14); ctx.lineTo(tx,by); ctx.closePath(); ctx.fill(); ctx.stroke(); return; }
  const cx=cam.x+view.w/2, cy=cam.y+view.h/2, a=Math.atan2(ty-cy,tx-cx);
  const m=40, hw=view.w/2-m, hh=view.h/2-m;
  const k=Math.min(Math.abs(hw/Math.cos(a)), Math.abs(hh/Math.sin(a)));
  const ex=cx+Math.cos(a)*k, ey=cy+Math.sin(a)*k;
  ctx.save(); ctx.translate(ex,ey); ctx.rotate(a); ctx.fillStyle="#e9b649"; ctx.strokeStyle="#2a1d05"; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(-10,-13); ctx.lineTo(-4,0); ctx.lineTo(-10,13); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();

    ${S.stage>=16?q("The Dark Tower","Princess Elowen",18,20,`Bring the Royal Key and all four knights (${S.team.length}/4 recruited) to the vines in the far north-east. Inside, every floor needs a different knight: carts and a cracked wall (Red), moon crystals (Purple), magic bolts (Blue), a hidden rune (Green). Defeat Grimtusk at the top and silence the bell.`):""}
    ${S.stage>=16?q("Restore the Crownstone","Thistlebeard",20,21,"Place the last piece in the Crownstone chamber behind the throne, inside the castle."):""}
    ${S.whistle?`<div class="q"><span class="tag">Ember's whistle</span><h3>Fly anywhere outdoors</h3><p>Press T, or use the button below.</p></div>`:""}
    ${q("The First Crownstone Piece","Thistlebeard",7,10,S.tabletRead?`Strike the crystals in order: ${S.order.map(o=>SYMS[o].n).join(", ")}. Then take the piece to Thistlebeard.`:"Find the crystal clearing north of the river. The stone tablet there shows the order.")}
    <div class="q ${S.toolsBack?"done":S.bramQuest?"active":""}"><span class="tag">${S.toolsBack?"Complete":S.bramQuest?"In progress":"Side quest"}</span><h3>Bram's Lost Tools</h3><small>From Bram the Blacksmith</small><p>${S.bramQuest?(S.mine.tools?"You have the tool chest. Bring it to Bram.":"Find Bram's tool chest in Coppercap Mine, up the forest road north-west of the bridge. Strike minecarts to roll them. The junction lever decides which way a cart turns."):"Bram will ask for help once the bridge is clear and you've spoken to Thistlebeard."}</p></div>
    <div class="q ${S.restored.length===4?"done":"active"}"><span class="tag">${S.restored.length===4?"Complete":"Castle restoration"}</span><h3>Restore Clovervale (${S.restored.length}/4)</h3><small>Restoration board by the castle</small>
      <ul style="margin:.3em 0 0;padding-left:1.1em">${PROJECTS.map(p=>`<li>${S.restored.includes(p.id)?"Done":"Needs"}: <b>${p.n}</b>${S.restored.includes(p.id)?"":` (${costText(p.cost)}${p.need?", plus Bram's tools":""})`}. ${p.perk}</li>`).join("")}</ul>
      <p style="margin-top:6px">You have ${S.mat.timber} timber, ${S.mat.stone} stone, ${S.mat.ore} copper ore. Timber: fallen logs in the woods. Stone and ore: Coppercap Mine.</p></div>
    <div class="q"><span class="tag">Your team</span><h3>Playing as the ${K().name}</h3>
      <ul style="margin:.3em 0 0;padding-left:1.1em">${Object.keys(KNIGHTS).map(k=>`<li>${S.team.includes(k)?`<b>${KNIGHTS[k].name}</b>: ${KNIGHTS[k].power}. ${KNIGHTS[k].tip}`:`Unknown knight: waiting at one of the banners on the map.`}</li>`).join("")}</ul>
      <small style="margin-top:6px">Switch knights at any banner. The cracked rock in the east meadow needs the Red Knight.</small></div>
    <div class="q"><span class="tag">Riding course</span><h3>${S.race.medal?MEDALS[S.race.medal].n+" ribbon":"No ribbon yet"}</h3><p>${S.race.best?`Best time ${S.race.best.toFixed(1)}s. `:""}Start at the course post by the meadow gate. Gold under ${GOLD_T}s, Silver under ${SILVER_T}s.</p></div>
    <div class="q"><span class="tag">Difficulty</span><h3>${D().n}</h3><p>${D().tip}</p><div class="diffs" style="justify-content:flex-start;margin-top:6px">${Object.entries(DIFF).map(([k,v])=>`<button class="btn" data-setdiff="${k}" aria-pressed="${(S.diff||"normal")===k}">${v.n}</button>`).join("")}</div></div>
    ${guide?`<div class="q"><span class="tag">Creature guide</span><ul style="margin:.3em 0 0;padding-left:1.1em">${guide}</ul></div>`:""}
    <div class="row" style="justify-content:flex-start"><button class="btn gold" data-ov="resume">Back to the game</button>${S.whistle&&AREA==="world"?`<button class="btn" data-ov="fly">Fly with Ember</button>`:""}<button class="btn" data-ov="title">Save and quit to title</button></div></div>`);
}
$("#ov").addEventListener("click", e=>{
  const p=e.target.closest("[data-pick]"); if(p){ pick=p.dataset.pick; titleScreen(); return; }
  const df=e.target.closest("[data-diff]"); if(df){ pickDiff=df.dataset.diff; titleScreen(); return; }
  const sd=e.target.closest("[data-setdiff]"); if(sd){ S.diff=sd.dataset.setdiff; save(); mode="play"; openJournal(); toast(`Difficulty set to ${D().n}.`,2000); return; }
  const b=e.target.closest("[data-ov]"); if(!b) return;
  const a=b.dataset.ov;
  if(a==="start"){ clearSave(); S=freshSave(pick); startGame(false); }
  if(a==="continue"){ S=loadSave(); if(!S) return titleScreen(); startGame(true); toast(stageObjective().t); }
  if(a==="resume"){ mode="play"; $("#ov").hidden=true; if(S.stage===10){ S.stage=11; save(); toast("Chapter 2 begins. Thistlebeard wants to see you."); } }
  if(a==="fly"){ mode="play"; $("#ov").hidden=true; flyMenu(); }
  if(a==="ngplus"){ const k=S.knight; clearSave(); pickDiff="hard"; S=freshSave(k); startGame(false); toast("A new quest begins, on Hard. Good luck!",3000); }
  if(a==="title"){ save(); titleScreen(); }
  if(a==="wake") wake();
});
$("#jbtn").addEventListener("click", ()=>{ if(mode==="journal"){ mode="play"; $("#ov").hidden=true; } else openJournal(); });
addEventListener("keydown", e=>{
  if(mode==="journal" && (e.code==="KeyQ"||e.code==="Escape")){ mode="play"; $("#ov").hidden=true; hit.journal=false; }
  if(dlg && /^Digit[1-4]$/.test(e.code)){ const b=document.querySelector(`#dlg [data-opt="${+e.code.slice(5)-1}"]`); if(b) b.click(); }
});

/* =====================================================================
   SIZE + LOOP
   ===================================================================== */
function resize(){
  const g=$("#game"), w=g.clientWidth;
  let h = Math.round(Math.min(w*.62, innerHeight*.8));
  if(w<620) h = Math.round(Math.min(innerHeight*.72, w*1.35));
  h = Math.max(h, 320);
  g.style.height = h+"px";
  view.dpr = Math.min(2, devicePixelRatio||1);
  cv.width = Math.round(w*view.dpr); cv.height = Math.round(h*view.dpr);
  view.cw=w; view.ch=h;
  view.zoom = clamp(Math.min(w/(15*TILE), h/(10*TILE)), .62, 1.25);
  if(w<620) view.zoom = clamp(w/(9.5*TILE), .62, 1);
  view.w = w/view.zoom; view.h = h/view.zoom;
}
addEventListener("resize", resize);
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  requestAnimationFrame(loop);
  try { if(S && P && mode!=="title"){ update(dt); draw(); hud(); } else { clearHits(); } }
  catch(err){ console.error(err); clearHits(); }
}
async function boot(){
  await Promise.all(Object.entries(IMG).map(([k,src])=>new Promise(r=>{ const i=new Image(); i.onload=r; i.onerror=r; i.src=src; IM[k]=i; })));
  setupTouch(); resize(); titleScreen(); requestAnimationFrame(loop);
}
boot();
</script>
